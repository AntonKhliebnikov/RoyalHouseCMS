<!doctype html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<body>

<th:block th:fragment="tabs(mode, activeTab, newBuildingId)">
    <ul class="nav nav-tabs mb-3">

        <!-- Вкладка "Основное" -->
        <th:block th:if="${mode == 'create'}">
            <th:block th:replace="~{::tabLink(
                      @{/admin/new-buildings/new},
                      'basic',
                      'Основное',
                      ${activeTab}
            )}"></th:block>
        </th:block>

        <th:block th:if="${mode == 'edit'}">
            <th:block th:replace="~{::tabLink(
                      @{/admin/new-buildings/{id}/edit(id=${newBuildingId})},
                      'basic',
                      'Основное',
                      ${activeTab}
            )}"></th:block>
        </th:block>

        <th:block th:if="${mode == 'view'}">
            <th:block th:replace="~{::tabLink(
                       @{/admin/new-buildings/{id}(id=${newBuildingId})},
                       'basic',
                       'Основное',
                       ${activeTab}
            )}"></th:block>
        </th:block>

        <!-- Вкладка "О проекте" -->
        <th:block th:if="${mode == 'create'}">
            <th:block th:replace="~{::disabledTab('О проекте')}"></th:block>
        </th:block>

        <th:block th:if="${mode == 'edit'}">
            <th:block th:replace="~{::tabLink(
                      @{/admin/new-buildings/{id}/about(id=${newBuildingId})},
                      'about',
                      'О проекте',
                      ${activeTab}
            )}"></th:block>
        </th:block>

        <th:block th:if="${mode == 'view'}">
            <th:block th:replace="~{::tabLink(
                      @{/admin/new-buildings/{id}/about/view(id=${newBuildingId})},
                      'about',
                      'О проекте',
                      ${activeTab}
            )}"></th:block>
        </th:block>

        <!-- Вкладка "Местоположение" -->
        <th:block th:if="${mode == 'create'}">
            <th:block th:replace="~{::disabledTab('Местоположение')}"></th:block>
        </th:block>

        <th:block th:if="${mode == 'edit'}">
            <th:block th:replace="~{::tabLink(
                      @{/admin/new-buildings/{id}/location(id=${newBuildingId})},
                      'location',
                      'Местоположение',
                      ${activeTab}
            )}"></th:block>
        </th:block>

        <th:block th:if="${mode == 'view'}">
            <th:block th:replace="~{::tabLink(
                      @{/admin/new-buildings/{id}/location/view(id=${newBuildingId})},
                      'location',
                      'Местоположение',
                      ${activeTab}
            )}"></th:block>
        </th:block>

        <!-- Вкладка "Инфраструктура" -->
        <th:block th:if="${mode == 'create'}">
            <th:block th:replace="~{::disabledTab('Инфраструктура')}"></th:block>
        </th:block>

        <th:block th:if="${mode == 'edit'}">
            <th:block th:replace="~{::tabLink(
                      @{/admin/new-buildings/{id}/infrastructure(id=${newBuildingId})},
                      'infrastructure',
                      'Инфраструктура',
                      ${activeTab}
            )}"></th:block>
        </th:block>

        <th:block th:if="${mode == 'view'}">
            <th:block th:replace="~{::tabLink(
                      @{/admin/new-buildings/{id}/infrastructure/view(id=${newBuildingId})},
                      'infrastructure',
                      'Инфраструктура',
                      ${activeTab}
            )}"></th:block>
        </th:block>

        <!-- Вкладка "Квартиры" -->
        <th:block th:if="${mode == 'create'}">
            <th:block th:replace="~{::disabledTab('Квартиры')}"></th:block>
        </th:block>

        <th:block th:if="${mode == 'edit'}">
            <th:block th:replace="~{::tabLink(
                      @{/admin/new-buildings/{id}/apartments(id=${newBuildingId})},
                      'apartments',
                      'Квартиры',
                      ${activeTab}
            )}"></th:block>
        </th:block>

        <th:block th:if="${mode == 'view'}">
            <th:block th:replace="~{::tabLink(
                      @{/admin/new-buildings/{id}/apartments/view(id=${newBuildingId})},
                      'apartments',
                      'Квартиры',
                      ${activeTab}
            )}"></th:block>
        </th:block>

        <!-- Вкладка "Панорама" -->
        <th:block th:if="${mode == 'create'}">
            <th:block th:replace="~{::disabledTab('Панорама')}"></th:block>
        </th:block>

        <th:block th:if="${mode == 'edit'}">
            <th:block th:replace="~{::tabLink(
                      @{/admin/new-buildings/{id}/panorama(id=${newBuildingId})},
                      'panorama',
                      'Панорама',
                      ${activeTab}
            )}"></th:block>
        </th:block>

        <th:block th:if="${mode == 'view'}">
            <th:block th:replace="~{::tabLink(
                      @{/admin/new-buildings/{id}/panorama/view(id=${newBuildingId})},
                      'panorama',
                      'Панорама',
                      ${activeTab}
            )}"></th:block>
        </th:block>

        <!-- Вкладка "Спецификация" -->
        <th:block th:if="${mode == 'create'}">
            <th:block th:replace="~{::disabledTab('Спецификация')}"></th:block>
        </th:block>

        <th:block th:if="${mode == 'edit'}">
            <th:block th:replace="~{::tabLink(
                      @{/admin/new-buildings/{id}/specification(id=${newBuildingId})},
                      'specification',
                      'Спецификация',
                      ${activeTab}
            )}"></th:block>
        </th:block>

        <th:block th:if="${mode == 'view'}">
            <th:block th:replace="~{::tabLink(
                      @{/admin/new-buildings/{id}/specification/view(id=${newBuildingId})},
                      'specification',
                      'Спецификация',
                      ${activeTab}
            )}"></th:block>
        </th:block>

    </ul>

    <div th:if="${mode == 'create'}" class="alert alert-info">
        Сначала сохраните новострой на вкладке «Основное». После этого станут доступны остальные вкладки.
    </div>
</th:block>

<th:block th:fragment="tabLink(href, tabKey, label, activeTab)">
    <li class="nav-item">
        <a th:href="${href}"
           class="nav-link"
           th:classappend="${activeTab == tabKey} ? ' active' : ''"
           th:text="${label}">
            Вкладка
        </a>
    </li>
</th:block>

<th:block th:fragment="disabledTab(label)">
    <li class="nav-item">
        <a href="#"
           class="nav-link disabled"
           th:text="${label}">
            Вкладка
        </a>
    </li>
</th:block>

</body>
</html>
