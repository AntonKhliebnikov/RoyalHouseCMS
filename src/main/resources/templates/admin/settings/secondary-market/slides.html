<!doctype html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(
        pageTitle=~{::title},
        content=~{::section},
        activeMenu='settings',
        activeSettingsItem='secondary-market',
        headerTitle='Вторичный рынок',
        breadcrumb='Настройки / Вторичный рынок',
        extraStyles=~{::styles},
        extraScripts=~{::scripts}
      )}">

<head>
    <meta charset="utf-8">
    <title>Вторичный рынок</title>

    <th:block th:fragment="styles">
        <link rel="stylesheet" th:href="@{/css/admin/secondary-market.css}">
    </th:block>
</head>

<body>
<section>

    <form id="secondary-market-form"
          th:action="@{/admin/settings/secondary-market}"
          th:object="${form}"
          method="post"
          enctype="multipart/form-data">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Слайды страницы "Вторичный рынок"</h3>
            </div>

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">Баннеры / слайды</h4>

                    <button type="button"
                            class="btn btn-outline-secondary btn-sm"
                            id="add-secondary-market-slide-btn">
                        <i class="fas fa-plus"></i> Добавить слайд
                    </button>
                </div>

                <div id="secondary-market-slides-container">

                    <div th:each="slide, stat : *{slides}"
                         class="secondary-market-slide-row border rounded p-3 mb-3"
                         th:attr="data-initial-active=${slide.isActive}">

                        <input type="hidden"
                               th:field="*{slides[__${stat.index}__].id}"
                               data-field="id">

                        <input type="hidden"
                               th:field="*{slides[__${stat.index}__].imagePath}"
                               data-field="imagePath">

                        <input type="hidden"
                               th:field="*{slides[__${stat.index}__].sortOrder}"
                               data-field="sortOrder">

                        <input type="hidden"
                               th:field="*{slides[__${stat.index}__].isActive}"
                               data-field="isActive">

                        <input type="hidden"
                               th:field="*{slides[__${stat.index}__].markedForDelete}"
                               data-field="markedForDelete">

                        <div class="row align-items-start">

                            <div class="col-md-4">
                                <div class="form-group mb-md-0">
                                    <label>
                                        Слайд №<span class="slide-number" th:text="${stat.index + 1}">1</span>
                                    </label>

                                    <div class="secondary-market-image-box mb-2">
                                        <img th:if="${slide.imagePath != null and !#strings.isEmpty(slide.imagePath)}"
                                             th:src="@{${slide.imagePath}}"
                                             alt="Слайд"
                                             class="secondary-market-preview-image slide-preview-image">

                                        <div th:if="${slide.imagePath == null or #strings.isEmpty(slide.imagePath)}"
                                             class="secondary-market-image-placeholder slide-preview-placeholder">
                                            <i class="fas fa-image fa-2x mb-2"></i>
                                            <div>Image</div>
                                        </div>
                                    </div>

                                    <div class="secondary-market-help-text">
                                        Рекомендуемый размер: 1920x800
                                    </div>

                                    <div class="custom-file">
                                        <input type="file"
                                               class="custom-file-input"
                                               th:id="'slides' + ${stat.index} + '_image'"
                                               th:field="*{slides[__${stat.index}__].image}"
                                               accept="image/jpeg,image/png,image/webp"
                                               data-field="image">

                                        <label class="custom-file-label"
                                               th:for="'slides' + ${stat.index} + '_image'">
                                            Выберите файл
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Текст баннера</label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{slides[__${stat.index}__].text}"
                                           data-field="text"
                                           maxlength="255"
                                           placeholder="Введите текст баннера">
                                </div>

                                <div class="form-group mb-md-0">
                                    <label>Ссылка</label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{slides[__${stat.index}__].linkUrl}"
                                           data-field="linkUrl"
                                           maxlength="500"
                                           placeholder="/secondary-market">
                                </div>
                            </div>

                            <div class="col-md-2">
                                <div class="form-group">
                                    <label>Статус</label>

                                    <div>
                                        <span class="badge slide-status-badge"
                                              th:classappend="${slide.isActive} ? ' badge-success' : ' badge-secondary'"
                                              th:text="${slide.isActive} ? 'Активен' : 'Отключен'">
                                            Активен
                                        </span>
                                    </div>
                                </div>

                                <div class="form-group mb-0">
                                    <label>Действия</label>

                                    <div class="d-flex">
                                        <button type="button"
                                                class="btn btn-outline-secondary btn-sm slide-toggle-btn mr-2">
                                            <i class="fas"
                                               th:classappend="${slide.isActive} ? ' fa-minus' : ' fa-plus'"></i>
                                        </button>

                                        <button type="button"
                                                class="btn btn-danger btn-sm slide-delete-btn"
                                                th:style="${slide.isActive} ? 'display:none;' : ''">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>

                <div id="secondary-market-slides-empty-state"
                     th:if="${#lists.isEmpty(form.slides)}"
                     class="text-muted">
                    Слайды пока не добавлены
                </div>

                <div class="text-right mt-4">
                    <a th:href="@{/admin/settings/secondary-market}" class="btn btn-default">
                        Отменить
                    </a>

                    <button type="submit" class="btn btn-success ml-2">
                        Сохранить
                    </button>
                </div>

            </div>
        </div>
    </form>

    <div id="secondary-market-slide-template" class="d-none">
        <div class="secondary-market-slide-row border rounded p-3 mb-3"
             data-initial-active="false">

            <input type="hidden" data-field="id" value="">
            <input type="hidden" data-field="imagePath" value="">
            <input type="hidden" data-field="sortOrder" value="">
            <input type="hidden" data-field="isActive" value="true">
            <input type="hidden" data-field="markedForDelete" value="false">

            <div class="row align-items-start">

                <div class="col-md-4">
                    <div class="form-group mb-md-0">
                        <label>
                            Слайд №<span class="slide-number">1</span>
                        </label>

                        <div class="secondary-market-image-box mb-2">
                            <img src=""
                                 alt="Слайд"
                                 class="secondary-market-preview-image slide-preview-image d-none">

                            <div class="secondary-market-image-placeholder slide-preview-placeholder">
                                <i class="fas fa-image fa-2x mb-2"></i>
                                <div>Image</div>
                            </div>
                        </div>

                        <div class="secondary-market-help-text">
                            Рекомендуемый размер: 1920x800
                        </div>

                        <div class="custom-file">
                            <input type="file"
                                   class="custom-file-input"
                                   accept="image/jpeg,image/png,image/webp"
                                   data-field="image"
                                   required>

                            <label class="custom-file-label">
                                Выберите файл
                            </label>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label>Текст баннера</label>

                        <input type="text"
                               class="form-control"
                               data-field="text"
                               maxlength="255"
                               placeholder="Введите текст баннера">
                    </div>

                    <div class="form-group mb-md-0">
                        <label>Ссылка</label>

                        <input type="text"
                               class="form-control"
                               data-field="linkUrl"
                               maxlength="500"
                               placeholder="/secondary-market">
                    </div>
                </div>

                <div class="col-md-2">
                    <div class="form-group">
                        <label>Статус</label>

                        <div>
                            <span class="badge badge-success slide-status-badge">Активен</span>
                        </div>
                    </div>

                    <div class="form-group mb-0">
                        <label>Действия</label>

                        <div class="d-flex">
                            <button type="button"
                                    class="btn btn-outline-secondary btn-sm slide-toggle-btn mr-2">
                                <i class="fas fa-minus"></i>
                            </button>

                            <button type="button"
                                    class="btn btn-danger btn-sm slide-delete-btn"
                                    style="display:none;">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</section>

<th:block th:fragment="scripts">
    <script th:src="@{/js/admin/secondary-market.js}"></script>
</th:block>

</body>
</html>
