<!doctype html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(
        pageTitle=~{::title},
        content=~{::section},
        activeMenu='settings',
        activeSettingsItem='contacts',
        headerTitle='Настройки',
        breadcrumb='Контакты',
        extraStyles=~{},
        extraScripts=~{}
      )}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты</title>
</head>

<body>
<section>

    <form th:action="@{/admin/settings/contacts}"
          th:object="${form}"
          method="post"
          id="contacts-form">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Контакты</h3>
            </div>

            <div class="card-body">

                <div class="alert alert-danger mb-4" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="error : ${#fields.globalErrors()}"
                         th:text="${error}"></div>
                </div>

                <h4 class="mb-3">Контактные данные</h4>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="phone">Телефон</label>
                            <input id="phone"
                                   type="text"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid'"
                                   th:field="*{phone}">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('phone')}"
                                 th:errors="*{phone}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="viberPhone">Viber</label>
                            <input id="viberPhone"
                                   type="text"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('viberPhone')} ? ' is-invalid'"
                                   th:field="*{viberPhone}">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('viberPhone')}"
                                 th:errors="*{viberPhone}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="telegramUsername">Telegram</label>
                            <input id="telegramUsername"
                                   type="text"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('telegramUsername')} ? ' is-invalid'"
                                   th:field="*{telegramUsername}">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('telegramUsername')}"
                                 th:errors="*{telegramUsername}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input id="email"
                                   type="email"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
                                   th:field="*{email}">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="instagramUrl">Instagram</label>
                            <input id="instagramUrl"
                                   type="text"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('instagramUrl')} ? ' is-invalid'"
                                   th:field="*{instagramUrl}">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('instagramUrl')}"
                                 th:errors="*{instagramUrl}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="facebookUrl">Facebook</label>
                            <input id="facebookUrl"
                                   type="text"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('facebookUrl')} ? ' is-invalid'"
                                   th:field="*{facebookUrl}">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('facebookUrl')}"
                                 th:errors="*{facebookUrl}"></div>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="form-group">
                            <label for="address">Адрес</label>
                            <input id="address"
                                   type="text"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('address')} ? ' is-invalid'"
                                   th:field="*{address}">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('address')}"
                                 th:errors="*{address}"></div>
                        </div>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">Почты для получения заявок</h4>
                    <button type="button"
                            class="btn btn-outline-secondary btn-sm"
                            id="add-recipient-email-btn">
                        <i class="fas fa-plus"></i> Добавить email
                    </button>
                </div>

                <div id="recipient-emails-container">
                    <div th:each="item, stat : *{recipientEmails}"
                         class="recipient-email-row border rounded p-3 mb-3">

                        <input type="hidden"
                               th:field="*{recipientEmails[__${stat.index}__].id}"
                               data-field="id">

                        <input type="hidden"
                               th:field="*{recipientEmails[__${stat.index}__].isActive}"
                               data-field="isActive">

                        <input type="hidden"
                               th:field="*{recipientEmails[__${stat.index}__].markedForDelete}"
                               data-field="markedForDelete">

                        <div class="row align-items-end">
                            <div class="col-md-8">
                                <div class="form-group mb-md-0">
                                    <label>Email получателя</label>
                                    <input type="email"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('recipientEmails[' + stat.index +'].email')} ? 'is-invalid'"
                                           th:field="*{recipientEmails[__${stat.index}__].email}"
                                           data-field="email"
                                           placeholder="Введите email">
                                </div>

                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('recipientEmails[' + stat.index +'].email')}"
                                     th:errors="*{recipientEmails[__${stat.index}__].email}">
                                </div>
                            </div>

                            <div class="col-md-2">
                                <div class="form-group mb-md-0">
                                    <label>Статус</label>
                                    <div>
                                        <span class="badge recipient-status-badge"
                                              th:classappend="${item.isActive} ? ' badge-success' : ' badge-secondary'"
                                              th:text="${item.isActive} ? 'Активен' : 'Отключен'">
                                            Активен
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-2">
                                <div class="form-group mb-0">
                                    <label>Действия</label>
                                    <div class="d-flex">
                                        <button type="button"
                                                class="btn btn-outline-secondary btn-sm recipient-toggle-btn mr-2"
                                                th:attr="data-active=${item.isActive}">
                                            <i class="fas"
                                               th:classappend="${item.isActive} ? ' fa-minus' : ' fa-plus'"></i>
                                        </button>

                                        <button type="button"
                                                class="btn btn-danger btn-sm recipient-delete-btn"
                                                th:style="${item.isActive} ? 'display:none;' : ''">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="recipient-emails-empty-state"
                     th:if="${#lists.isEmpty(form.recipientEmails)}"
                     class="text-muted">
                    Email получателей пока не добавлены
                </div>

                <div class="text-right mt-4">
                    <a th:href="@{/admin/settings/contacts}" class="btn btn-default">Отменить</a>
                    <button type="submit" class="btn btn-success ml-2">Сохранить</button>
                </div>
            </div>
        </div>
    </form>

    <div id="recipient-email-template" class="d-none">
        <div class="recipient-email-row border rounded p-3 mb-3">
            <input type="hidden" data-field="id" value="">
            <input type="hidden" data-field="isActive" value="true">
            <input type="hidden" data-field="markedForDelete" value="false">

            <div class="row align-items-end">
                <div class="col-md-8">
                    <div class="form-group mb-md-0">
                        <label>Email получателя</label>
                        <input type="email"
                               class="form-control"
                               data-field="email"
                               placeholder="Введите email">
                    </div>
                </div>

                <div class="col-md-2">
                    <div class="form-group mb-md-0">
                        <label>Статус</label>
                        <div>
                            <span class="badge badge-success recipient-status-badge">Активен</span>
                        </div>
                    </div>
                </div>

                <div class="col-md-2">
                    <div class="form-group mb-0">
                        <label>Действия</label>
                        <div class="d-flex">
                            <button type="button"
                                    class="btn btn-outline-secondary btn-sm recipient-toggle-btn mr-2">
                                <i class="fas fa-minus"></i>
                            </button>

                            <button type="button"
                                    class="btn btn-danger btn-sm recipient-delete-btn"
                                    style="display:none;">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('contacts-form');
            const container = document.getElementById('recipient-emails-container');
            const addButton = document.getElementById('add-recipient-email-btn');
            const template = document.getElementById('recipient-email-template');
            const emptyState = document.getElementById('recipient-emails-empty-state');

            function syncEmptyState() {
                const visibleRows = container.querySelectorAll('.recipient-email-row:not(.d-none)');
                if (emptyState) {
                    emptyState.style.display = visibleRows.length === 0 ? '' : 'none';
                }
            }

            function updateRowVisualState(row) {
                const isActiveInput = row.querySelector('[data-field="isActive"]');
                const badge = row.querySelector('.recipient-status-badge');
                const toggleBtn = row.querySelector('.recipient-toggle-btn');
                const toggleIcon = toggleBtn ? toggleBtn.querySelector('i') : null;
                const deleteBtn = row.querySelector('.recipient-delete-btn');

                const isActive = isActiveInput.value === 'true';

                if (badge) {
                    badge.classList.remove('badge-success', 'badge-secondary');
                    badge.classList.add(isActive ? 'badge-success' : 'badge-secondary');
                    badge.textContent = isActive ? 'Активен' : 'Отключен';
                }

                if (toggleIcon) {
                    toggleIcon.classList.remove('fa-plus', 'fa-minus');
                    toggleIcon.classList.add(isActive ? 'fa-minus' : 'fa-plus');
                }

                if (deleteBtn) {
                    deleteBtn.style.display = isActive ? 'none' : '';
                }
            }

            function renumberRows() {
                const rows = container.querySelectorAll('.recipient-email-row');

                rows.forEach(function (row, index) {
                    const idInput = row.querySelector('[data-field="id"]');
                    const emailInput = row.querySelector('[data-field="email"]');
                    const isActiveInput = row.querySelector('[data-field="isActive"]');
                    const markedForDeleteInput = row.querySelector('[data-field="markedForDelete"]');

                    if (idInput) {
                        idInput.name = 'recipientEmails[' + index + '].id';
                        idInput.id = 'recipientEmails' + index + '.id';
                    }

                    if (emailInput) {
                        emailInput.name = 'recipientEmails[' + index + '].email';
                        emailInput.id = 'recipientEmails' + index + '.email';
                    }

                    if (isActiveInput) {
                        isActiveInput.name = 'recipientEmails[' + index + '].isActive';
                        isActiveInput.id = 'recipientEmails' + index + '.isActive';
                    }

                    if (markedForDeleteInput) {
                        markedForDeleteInput.name = 'recipientEmails[' + index + '].markedForDelete';
                        markedForDeleteInput.id = 'recipientEmails' + index + '.markedForDelete';
                    }
                });
            }

            function addRecipientEmailRow() {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = template.innerHTML.trim();

                const newRow = wrapper.firstElementChild;
                container.appendChild(newRow);

                renumberRows();
                updateRowVisualState(newRow);
                syncEmptyState();
            }

            if (addButton) {
                addButton.addEventListener('click', function () {
                    addRecipientEmailRow();
                });
            }

            container.addEventListener('click', function (event) {
                const toggleBtn = event.target.closest('.recipient-toggle-btn');
                if (toggleBtn) {
                    const row = toggleBtn.closest('.recipient-email-row');
                    const isActiveInput = row.querySelector('[data-field="isActive"]');

                    const isActive = isActiveInput.value === 'true';
                    isActiveInput.value = isActive ? 'false' : 'true';

                    updateRowVisualState(row);
                    return;
                }

                const deleteBtn = event.target.closest('.recipient-delete-btn');
                if (deleteBtn) {
                    const row = deleteBtn.closest('.recipient-email-row');
                    const idInput = row.querySelector('[data-field="id"]');
                    const markedForDeleteInput = row.querySelector('[data-field="markedForDelete"]');

                    const hasId = idInput && idInput.value && idInput.value.trim() !== '';

                    if (!hasId) {
                        row.remove();
                    } else {
                        markedForDeleteInput.value = 'true';
                        row.classList.add('d-none');
                    }

                    renumberRows();
                    syncEmptyState();
                }
            });

            const existingRows = container.querySelectorAll('.recipient-email-row');
            existingRows.forEach(function (row) {
                updateRowVisualState(row);
            });

            renumberRows();
            syncEmptyState();

            if (form) {
                form.addEventListener('submit', function () {
                    renumberRows();
                });
            }
        });
    </script>

</section>
</body>
</html>
