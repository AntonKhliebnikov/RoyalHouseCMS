<!doctype html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(
        pageTitle=~{::title},
        content=~{::section},
        activeMenu='settings',
        activeSettingsItem='contacts',
        headerTitle='Настройки',
        breadcrumb='Контакты',
        extraStyles=~{},
        extraScripts=~{::contactsScripts}
      )}">

<head>
    <title>Контакты</title>
</head>

<body>
<section>

    <form th:action="@{/admin/settings/contacts}"
          th:object="${form}"
          method="post"
          id="contacts-form">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="card">
            <div class="card-header">
                <h3 class="card-title">Контакты</h3>
            </div>

            <div class="card-body">

                <div class="alert alert-danger mb-4" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="error : ${#fields.globalErrors()}"
                         th:text="${error}"></div>
                </div>

                <h4 class="mb-3">Контактные данные</h4>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="phone">Телефон</label>
                            <input id="phone"
                                   type="text"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid'"
                                   th:field="*{phone}">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('phone')}"
                                 th:errors="*{phone}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="viberPhone">Viber</label>
                            <input id="viberPhone"
                                   type="text"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('viberPhone')} ? ' is-invalid'"
                                   th:field="*{viberPhone}">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('viberPhone')}"
                                 th:errors="*{viberPhone}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="telegramUsername">Telegram</label>
                            <input id="telegramUsername"
                                   type="text"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('telegramUsername')} ? ' is-invalid'"
                                   th:field="*{telegramUsername}">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('telegramUsername')}"
                                 th:errors="*{telegramUsername}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input id="email"
                                   type="email"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
                                   th:field="*{email}">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="instagramUrl">Instagram</label>
                            <input id="instagramUrl"
                                   type="text"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('instagramUrl')} ? ' is-invalid'"
                                   th:field="*{instagramUrl}">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('instagramUrl')}"
                                 th:errors="*{instagramUrl}"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="facebookUrl">Facebook</label>
                            <input id="facebookUrl"
                                   type="text"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('facebookUrl')} ? ' is-invalid'"
                                   th:field="*{facebookUrl}">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('facebookUrl')}"
                                 th:errors="*{facebookUrl}"></div>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="form-group">
                            <label for="address">Адрес</label>
                            <input id="address"
                                   type="text"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('address')} ? ' is-invalid'"
                                   th:field="*{address}">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('address')}"
                                 th:errors="*{address}"></div>
                        </div>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">Почты для получения заявок</h4>
                    <button type="button"
                            class="btn btn-outline-secondary btn-sm"
                            id="add-recipient-email-btn">
                        <i class="fas fa-plus"></i> Добавить email
                    </button>
                </div>

                <div id="recipient-emails-container">
                    <div th:each="item, stat : *{recipientEmails}"
                         class="recipient-email-row border rounded p-3 mb-3">

                        <input type="hidden"
                               th:field="*{recipientEmails[__${stat.index}__].id}"
                               data-field="id">

                        <input type="hidden"
                               th:field="*{recipientEmails[__${stat.index}__].isActive}"
                               data-field="isActive">

                        <input type="hidden"
                               th:field="*{recipientEmails[__${stat.index}__].markedForDelete}"
                               data-field="markedForDelete">

                        <div class="row align-items-end">
                            <div class="col-md-8">
                                <div class="form-group mb-md-0">
                                    <label>Email получателя</label>
                                    <input type="email"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('recipientEmails[' + stat.index +'].email')} ? ' is-invalid'"
                                           th:field="*{recipientEmails[__${stat.index}__].email}"
                                           th:readonly="${item.id != null}"
                                           data-field="email"
                                           placeholder="Введите email">
                                </div>

                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('recipientEmails[' + stat.index +'].email')}"
                                     th:errors="*{recipientEmails[__${stat.index}__].email}">
                                </div>
                            </div>

                            <div class="col-md-2">
                                <div class="form-group mb-md-0">
                                    <label>Статус</label>
                                    <div>
                                        <span class="badge recipient-status-badge"
                                              th:classappend="${item.isActive} ? ' badge-success' : ' badge-secondary'"
                                              th:text="${item.isActive} ? 'Активен' : 'Отключен'">
                                            Активен
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-2">
                                <div class="form-group mb-0">
                                    <label>Действия</label>
                                    <div class="d-flex">
                                        <button type="button"
                                                class="btn btn-outline-secondary btn-sm recipient-toggle-btn mr-2">
                                            <i class="fas"
                                               th:classappend="${item.isActive} ? ' fa-minus' : ' fa-plus'"></i>
                                        </button>

                                        <button type="button"
                                                class="btn btn-danger btn-sm recipient-delete-btn"
                                                th:classappend="${item.isActive} ? ' d-none' : ''">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="recipient-emails-empty-state"
                     th:if="${#lists.isEmpty(form.recipientEmails)}"
                     class="text-muted">
                    Email получателей пока не добавлены
                </div>

                <div class="text-right mt-4">
                    <a th:href="@{/admin/settings/contacts}" class="btn btn-default">Отменить</a>
                    <button type="submit" class="btn btn-success ml-2">Сохранить</button>
                </div>
            </div>
        </div>
    </form>

    <div id="recipient-email-template" class="d-none">
        <div class="recipient-email-row border rounded p-3 mb-3">
            <input type="hidden" data-field="id" value="">
            <input type="hidden" data-field="isActive" value="true">
            <input type="hidden" data-field="markedForDelete" value="false">

            <div class="row align-items-end">
                <div class="col-md-8">
                    <div class="form-group mb-md-0">
                        <label>Email получателя</label>
                        <input type="email"
                               class="form-control"
                               data-field="email"
                               placeholder="Введите email">
                    </div>
                </div>

                <div class="col-md-2">
                    <div class="form-group mb-md-0">
                        <label>Статус</label>
                        <div>
                            <span class="badge badge-success recipient-status-badge">Активен</span>
                        </div>
                    </div>
                </div>

                <div class="col-md-2">
                    <div class="form-group mb-0">
                        <label>Действия</label>
                        <div class="d-flex">
                            <button type="button"
                                    class="btn btn-outline-secondary btn-sm recipient-toggle-btn mr-2">
                                <i class="fas fa-minus"></i>
                            </button>

                            <button type="button"
                                    class="btn btn-danger btn-sm recipient-delete-btn d-none">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</section>

<th:block th:fragment="contactsScripts">
    <script th:src="@{/js/admin/settings-contacts.js}"></script>
</th:block>

</body>
</html>
