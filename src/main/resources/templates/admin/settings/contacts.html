<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(
        pageTitle=~{::title},
        content=~{::section},
        activeMenu='settings',
        activeSettingsItem='contacts',
        headerTitle='Настройки',
        breadcrumb='Контакты',
        extraStyles=~{},
        extraScripts=~{}
      )}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты</title>
</head>
<body>
<section th:with="kyivZone=${T(java.time.ZoneId).of('Europe/Kyiv')}">

    <div class="row">

        <div class="col-lg-6">

            <div class="card">

                <div class="card-header">
                    <h3 class="card-title">Контактные данные</h3>
                </div>

                <div class="card-body">

                    <form th:action="@{/admin/settings/contacts}"
                          th:object="${contactForm}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <div class="row">

                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="phone">Телефон</label>
                                    <input id="phone"
                                           type="text"
                                           class="form-control"
                                           th:field="*{phone}">
                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('phone')}"
                                         th:errors="*{phone}"></div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="viberPhone">Viber</label>
                                    <input id="viberPhone"
                                           type="text"
                                           class="form-control"
                                           th:field="*{viberPhone}">
                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('viberPhone')}"
                                         th:errors="*{viberPhone}"></div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="telegramUsername">Telegram</label>
                                    <input id="telegramUsername"
                                           type="text"
                                           class="form-control"
                                           th:field="*{telegramUsername}">
                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('telegramUsername')}"
                                         th:errors="*{telegramUsername}"></div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="email">Email</label>
                                    <input id="email"
                                           type="email"
                                           class="form-control"
                                           th:field="*{email}">
                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('email')}"
                                         th:errors="*{email}"></div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="instagramUrl">Instagram</label>
                                    <input id="instagramUrl"
                                           type="text"
                                           class="form-control"
                                           th:field="*{instagramUrl}">
                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('instagramUrl')}"
                                         th:errors="*{instagramUrl}"></div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="facebookUrl">Facebook</label>
                                    <input id="facebookUrl"
                                           type="text"
                                           class="form-control"
                                           th:field="*{facebookUrl}">
                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('facebookUrl')}"
                                         th:errors="*{facebookUrl}"></div>
                                </div>
                            </div>

                            <div class="col-12">
                                <div class="form-group">
                                    <label for="address">Адрес</label>
                                    <input id="address"
                                           type="text"
                                           class="form-control"
                                           th:field="*{address}">
                                    <div class="text-danger small mt-1"
                                         th:if="${#fields.hasErrors('address')}"
                                         th:errors="*{address}"></div>
                                </div>
                            </div>

                        </div>

                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">
                                Сохранить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-6">

            <div class="card">

                <div class="card-header">
                    <h3 class="card-title">Почты для получения заявок</h3>
                </div>

                <div class="card-body">

                    <form th:action="@{/admin/settings/contacts/recipient-emails}"
                          th:object="${recipientEmailForm}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <div class="form-group">
                            <label for="recipientEmail">Email получателя</label>
                            <input id="recipientEmail"
                                   type="email"
                                   class="form-control"
                                   th:field="*{email}">
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"></div>
                        </div>

                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">
                                Добавить
                            </button>
                        </div>

                    </form>

                    <hr>

                    <h5 class="mb-3">Список получателей</h5>

                    <div th:if="${#lists.isEmpty(recipientEmails)}"
                         class="text-muted">
                        Список получателей пуст
                    </div>

                    <div th:if="${!#lists.isEmpty(recipientEmails)}"
                         class="table-responsive">

                        <table class="table table-bordered table-hover">

                            <thead>
                            <tr>
                                <th>Email</th>
                                <th style="width: 140px">Статус</th>
                                <th style="width: 260px">Действия</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="recipient : ${recipientEmails}">
                                <td th:text="${recipient.email}"></td>

                                <td>
                                    <span th:if="${recipient.isActive}" class="badge badge-success">Активен</span>
                                    <span th:if="${!recipient.isActive}" class="badge badge-secondary">Отключен</span>
                                </td>

                                <td class="text-nowrap">
                                    <form th:if="${recipient.isActive}"
                                          th:action="@{/admin/settings/contacts/recipient-emails/{id}/disable(id=${recipient.id})}"
                                          method="post"
                                          class="d-inline">
                                        <input type="hidden"
                                               th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}">
                                        <button type="submit"
                                                class="btn btn-warning btn-sm">
                                            Отключить
                                        </button>
                                    </form>

                                    <form th:if="${!recipient.isActive}"
                                          th:action="@{/admin/settings/contacts/recipient-emails/{id}/enable(id=${recipient.id})}"
                                          method="post"
                                          class="d-inline">
                                        <input type="hidden"
                                               th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}">
                                        <button type="submit"
                                                class="btn btn-success btn-sm">
                                            Включить
                                        </button>
                                    </form>

                                    <form th:if="${!recipient.isActive}"
                                          th:action="@{/admin/settings/contacts/recipient-emails/{id}/delete(id=${recipient.id})}"
                                          method="post"
                                          class="d-inline"
                                          onsubmit="return confirm('Удалить email окончательно?');">
                                        <input type="hidden"
                                               th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}">
                                        <button type="submit"
                                                class="btn btn-danger btn-sm">
                                            Удалить
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
