<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="settingsSubmenuLink(href, itemKey, label, activeSettingsItem)">
    <li class="nav-item">
        <a th:href="${href}"
           class="nav-link"
           th:classappend="${activeSettingsItem == itemKey} ? 'active'">
            <i class="far fa-circle nav-icon"></i>
            <p th:text="${label}">Пункт меню</p>
        </a>
    </li>
</th:block>

</body>
</html>
